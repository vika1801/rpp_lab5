services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty_pass
      POSTGRES_DB: loyalty_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty -d loyalty_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: loyalty
      RABBITMQ_DEFAULT_PASS: loyalty_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql+asyncpg://loyalty:loyalty_pass@postgres:5432/loyalty_db
      RABBITMQ_URL: amqp://loyalty:loyalty_pass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://loyalty:loyalty_pass@postgres:5432/loyalty_db
      RABBITMQ_URL: amqp://loyalty:loyalty_pass@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped

  notifier:
    build: ./notifier
    environment:
      RABBITMQ_URL: amqp://loyalty:loyalty_pass@rabbitmq:5672/
      MIN_DELAY_MS: "200"
      MAX_DELAY_MS: "1500"
      UNSUBSCRIBED: ""
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build: ./analytics
    environment:
      RABBITMQ_URL: amqp://loyalty:loyalty_pass@rabbitmq:5672/
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
